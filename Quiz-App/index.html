<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5 container-fluid main p-5">
      <h1 class="text-center mb-4 quiz">Quiz App</h1>
      <div id="quiz-container" class="card p-4">
        <h3 id="question" class="mb-3"></h3>
        <div id="options" class="mb-3"></div>
        <h1 id="result" class="mb-3"></h1>
        <button id="next-btn" class="btn btn-outline-warning" onclick="nextQuestion()">
          Next Question
        </button>
        <!-- <button id="start-btn" class="btn btn-success" onclick="showQuestion()">
          Start Quiz
        </button> -->
        <div id="timeDiv" class="mt-3">Time Left: <span id="time">30</span>s</div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
